<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacific Seeds — Nursery Workbook</title>
<link rel="icon" href="/static/ps-logo.svg">
<style>
  :root {
    --navy: #092a40;
    --ink: #1b2b38;
    --ink-soft: #34526e;
    --muted: #6b8299;
    --line: #d8e2ea;
    --pale: #e9f3fc;
    --grey: #f4f7fa;
    --blue: #0678cd;
    --deep: #045a9b;
    --bg: #ffffff;
    --fwd: #e7f0ff;
    --rev: #edf8f1;
    --warn: #fff5e3;
    --bad: #ffecef;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: grid;
    grid-template-columns: 250px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas: "brand top" "nav main";
  }

  header.brand {
    grid-area: brand;
    background: var(--navy);
    color: #fff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header.brand img { height: 22px; }
  header.brand b { font-size: 14px; letter-spacing: .02em; }

  .topbar {
    grid-area: top;
    background: var(--navy);
    color: #cfe2f2;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 13px;
  }
  .topbar .code { color: #fff; font-weight: 600; }
  .topbar .types { color: #9fc4e2; }
  .topbar .spacer { flex: 1; }
  .topbar button {
    background: var(--blue); color: #fff; border: 0; border-radius: 5px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .topbar button:hover { background: var(--deep); }

  nav {
    grid-area: nav;
    border-right: 1px solid var(--line);
    background: var(--grey);
    overflow-y: auto;
    padding: 10px 0 40px;
  }
  nav .group {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); padding: 14px 18px 6px; font-weight: 700;
  }
  nav a {
    display: block; padding: 7px 18px; color: var(--ink-soft);
    text-decoration: none; border-left: 3px solid transparent; cursor: pointer;
  }
  nav a:hover { background: var(--pale); }
  nav a.active {
    background: #fff; border-left-color: var(--blue);
    color: var(--navy); font-weight: 600;
  }

  main { grid-area: main; overflow: auto; padding: 24px 28px 60px; }
  h1 { font-size: 21px; margin: 0 0 4px; color: var(--navy); }
  .sub { color: var(--muted); margin: 0 0 18px; }

  .btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 20px; }
  button.action {
    background: var(--blue); color: #fff; border: 0; border-radius: 6px;
    padding: 9px 15px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button.action:hover { background: var(--deep); }
  button.action.ghost {
    background: #fff; color: var(--deep); border: 1px solid var(--line);
  }
  button.action.ghost:hover { background: var(--pale); }

  textarea.paste {
    width: 100%; min-height: 220px; font: 12px/1.45 ui-monospace, Menlo, monospace;
    border: 1px solid var(--line); border-radius: 6px; padding: 10px;
  }

  table { border-collapse: collapse; font-size: 12.5px; }
  th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  th { background: var(--pale); color: var(--navy); font-weight: 600; white-space: nowrap; }
  td.num, th.num { text-align: center; }
  .scroll { overflow-x: auto; max-width: 100%; }

  .grid td { text-align: center; font-size: 11px; min-width: 62px; white-space: pre-line; }
  .grid td.hdr, .grid th { background: var(--pale); font-weight: 700; }
  .fwd { background: var(--fwd); }
  .rev { background: var(--rev); }
  .bline { background: #cff0d4; }
  .dup { background: var(--bad); }

  .empty {
    border: 1px dashed var(--line); border-radius: 8px; padding: 26px;
    color: var(--muted); background: var(--grey);
  }
  .empty.dragging {
    border-color: var(--blue); background: var(--pale); color: var(--deep);
  }
  .note {
    background: var(--warn); border: 1px solid #f0dcb4; border-radius: 6px;
    padding: 10px 12px; margin: 12px 0; color: #6a4c12;
  }
  .home-card {
    border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
    margin-bottom: 10px;
  }
  .home-card h3 { margin: 0 0 4px; font-size: 14px; color: var(--navy); }
  .home-card p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  label.f { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 13px; }
  input.f, select.f {
    width: 100%; max-width: 420px; padding: 7px 9px;
    border: 1px solid var(--line); border-radius: 5px; font-size: 13px;
  }
  /* Which nursery is open, and how to move between them. */
  .nursery-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 12px 14px; margin: 0 0 18px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  .nursery-bar label { font-weight: 600; font-size: 13px; color: var(--ink-soft); }
  .nursery-bar select.f { margin: 0; }
  /* Columns sized to their contents, for the replacement logs. */
  table.fit td input.f { min-width: 120px; }
  .kv { display: grid; grid-template-columns: 260px 1fr; max-width: 760px; }
  .kv div { border-bottom: 1px solid var(--line); padding: 6px 8px; }
  .kv div:nth-child(odd) { color: var(--ink-soft); }
</style>
</head>
<body>
  <header class="brand">
    <img src="/static/ps-logo-white.svg" alt="">
    <b>Nursery Workbook</b>
  </header>

  <div class="topbar">
    <span>Nursery <span class="code" id="topCode">—</span></span>
    <span class="types" id="topTypes"></span>
    <span class="spacer"></span>
    <button id="btnInit">Initialise nursery</button>
    <button id="btnReset" style="background:#7d8c99">Reset</button>
  </div>

  <nav id="nav"></nav>
  <main id="main"></main>

  <!-- Absolute /static paths: the page is served at /app, so relative URLs
       would resolve to /app.js and miss the StaticFiles mount. -->
  <script type="module" src="/static/app.js"></script>
</body>
</html>
